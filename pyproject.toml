[project]
name = "meet-transcript-analyzer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "crewai>=0.130.0",
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.166.0",
]

[project.scripts]
meet-analyzer = "meet_analyzer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
